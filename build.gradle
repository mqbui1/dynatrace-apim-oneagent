plugins {
    id 'java'
    id "io.freefair.aspectj.post-compile-weaving" version "5.3.3.3"

}

group 'com.axway'
version '1.0.18'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xlint:deprecation']
}

def apim_folder = '/Users/rnatarajan/IdeaProjects/dynatrace-aspectj/apim'

// The real Axway API Gateway libraries (com.vordel.*, com.vordel.coreapireg.*) are proprietary
// and only exist inside a licensed Axway install at apim_folder above. When that folder isn't
// present (e.g. this otel-instrument verification run), fall back to a local stub sourceSet that
// mirrors just the method signatures this project actually calls, so OneAgentSDKUtils.java can
// still be compiled and unit-tested. The stub classes are compileOnly/testImplementation -- never
// packaged into the jar -- so a real licensed build (apim_folder present) is unaffected.
def apimLibsAvailable = file("${apim_folder}/lib").exists()

sourceSets {
    verifyStubs {
        java.srcDirs = ['verify-stubs/java']
    }
    main {
        if (!apimLibsAvailable) {
            // AxwayAspect.java additionally needs com.vordel.circuit.MessageProcessor,
            // com.vordel.coreapireg.runtime.* (ApiShunt/InvokableMethod/PathResolverResult), which
            // this project doesn't change and which aren't stubbed -- see java.full in
            // .observe/otel-audit.json's verification.environments for why this is out of scope
            // for local unit verification.
            java {
                exclude 'com/axway/aspects/apim/AxwayAspect.java'
            }
        }
    }
}

dependencies {
    if (apimLibsAvailable) {
        implementation fileTree(dir: "${apim_folder}/lib", include: '*.jar')
        implementation fileTree(dir: "${apim_folder}/lib/jce", include: '*.jar')
        implementation fileTree(dir: "${apim_folder}/lib/plugins", include: '*.jar')
    } else {
        compileOnly sourceSets.verifyStubs.output
        testImplementation sourceSets.verifyStubs.output
    }
    implementation group: 'org.aspectj', name: 'aspectjweaver', version: '1.9.6'
    implementation group: 'com.dynatrace.oneagent.sdk.java', name: 'oneagent-sdk', version: '1.8.0'

    implementation platform('io.opentelemetry:opentelemetry-bom:1.67.0')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '3.12.4'
    testImplementation group: 'org.powermock', name: 'powermock-module-junit4', version: '2.0.9'
    testImplementation group: 'org.powermock', name: 'powermock-api-mockito2', version: '2.0.9'
    testImplementation group: 'org.eclipse.angus', name: 'angus-mail', version: '2.0.5'
    testImplementation("org.apache.commons:commons-lang3:3.20.0")
    testImplementation("org.apache.commons:commons-collections4:4.5.0")
}
jar{
    metaInf {from('src/main/resources/aop.xml')}
}
